# Builds an UNSIGNED iPhone app (.ipa) on GitHub's Macs, ready to sideload with Sideloadly or AltStore
# (they sign it with a free Apple ID). Runs on every push to main, or by hand from the Actions tab.
# Download the result from the run's page, under "Artifacts".
#
# The .NET iOS tools and Xcode must match exactly, so both are pinned here:
#   workload set 10.0.401  <->  Xcode 26.6   (see https://whichversionofxcodeformaui.com)
# To move to newer versions later, change all three values together.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          PROJ=$(find . -name CoupleRewards.csproj -not -path "*/bin/*" -not -path "*/obj/*" | head -n 1)
          if [ -z "$PROJ" ]; then echo "CoupleRewards.csproj isn't in the repo"; exit 1; fi
          echo "Found $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "PROJDIR=$(dirname "$PROJ")" >> "$GITHUB_ENV"

      - name: Use Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install .NET 10 (4xx SDK band, to match the workload set below)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - name: Install the .NET MAUI iOS workload (version that matches Xcode 26.6)
        run: |
          dotnet --version
          dotnet workload install maui-ios --version 10.0.401

      - name: Build the app (no code signing)
        # TargetFrameworks is overridden so the Android half of the project isn't needed here.
        run: >
          dotnet build "$PROJ" -c Release
          -p:TargetFrameworks=net10.0-ios
          -f net10.0-ios
          -r ios-arm64
          -p:EnableCodeSigning=false

      - name: Package as .ipa
        run: |
          APP=$(find "$PROJDIR/bin/Release/net10.0-ios/ios-arm64" -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CoupleRewards.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CoupleRewards-ipa
          path: CoupleRewards.ipa
          retention-days: 30
